<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Secret Space 💖</title>
    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0f0716; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        /* Floating Hearts Background */
        .heart-bg { position: absolute; width: 100%; height: 100%; overflow: hidden; z-index: 0; pointer-events: none; }
        .heart { position: absolute; color: rgba(255, 42, 112, 0.25); font-size: 20px; animation: float 6s infinite ease-in; }
        @keyframes float { 0% { transform: translateY(100vh) scale(0.5); opacity: 1; } 100% { transform: translateY(-10vh) scale(1.2); opacity: 0; } }

        .card { background: rgba(27, 14, 38, 0.9); width: 100%; max-width: 420px; height: 92vh; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(255, 42, 112, 0.25); border: 1px solid rgba(255, 42, 112, 0.2); z-index: 1; backdrop-filter: blur(10px); }
        .header { background: linear-gradient(135deg, #ff2a70, #9a0043); padding: 15px 20px; text-align: center; font-weight: bold; font-size: 1.2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

        /* Join Screen */
        #join-screen { padding: 40px 25px; display: flex; flex-direction: column; gap: 18px; justify-content: center; height: 100%; text-align: center; }
        .title { font-size: 1.6rem; color: #ff2a70; font-weight: 700; text-shadow: 0 0 10px rgba(255,42,112,0.5); }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,42,112,0.3); background: rgba(255, 255, 255, 0.05); color: #fff; font-size: 1rem; outline: none; transition: 0.3s; }
        input:focus { border-color: #ff2a70; box-shadow: 0 0 10px rgba(255,42,112,0.4); }
        button.action-btn { padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, #ff2a70, #d11149); color: white; font-weight: bold; font-size: 1.05rem; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(255,42,112,0.4); }
        button.action-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,42,112,0.6); }

        /* Chat Screen */
        #chat-screen { display: none; flex-direction: column; height: 100%; }
        #messages-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        .message { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; word-wrap: break-word; position: relative; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .sent { background: linear-gradient(135deg, #ff2a70, #c4004f); align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 4px 12px rgba(255,42,112,0.3); }
        .received { background: #281738; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid rgba(255, 42, 112, 0.2); }
        .sender-name { font-size: 0.7rem; color: #ff85ad; margin-bottom: 4px; font-weight: 600; }
        .msg-footer { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 4px; font-size: 0.65rem; opacity: 0.8; }

        .input-area { display: flex; padding: 12px; background: rgba(15, 7, 22, 0.95); gap: 10px; border-top: 1px solid rgba(255, 42, 112, 0.2); }
        .input-area input { flex: 1; }
        .input-area button { padding: 0 22px; border-radius: 12px; border: none; background: #ff2a70; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="heart-bg" id="hearts"></div>

<div class="card">
    <div class="header">
        <span id="room-header">💖 Secret Space</span>
    </div>

    <!-- Join Screen -->
    <div id="join-screen">
        <div class="title">Our Love Corner 👩‍❤️‍👨</div>
        <p style="font-size: 0.85rem; color: #bbb;">Bina kisi login ke apni secret dunia me aao!</p>
        <input type="text" id="username-input" placeholder="Aapka Pyara Naam ❤️">
        <input type="text" id="room-input" placeholder="Secret Room Code (e.g. love2026)">
        <button class="action-btn" onclick="joinRoom()">Enter Secret World ✨</button>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen">
        <div id="messages-container"></div>
        <div class="input-area">
            <input type="text" id="message-input" placeholder="Type a cute message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send 💕</button>
        </div>
    </div>
</div>

<script>
    // Zap3x Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyBY8NNSdWPwP8790my8KlpestQD8qDkqhw",
        authDomain: "zap3x-6655f.firebaseapp.com",
        databaseURL: "https://zap3x-6655f-default-rtdb.firebaseio.com",
        projectId: "zap3x-6655f",
        storageBucket: "zap3x-6655f.firebasestorage.app",
        messagingSenderId: "132164789124",
        appId: "1:132164789124:web:7eac2f0028324ac06b3d1"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = "";
    let currentRoom = "";

    // Background floating hearts animation
    for(let i=0; i<15; i++){
        let heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = '❤️';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDelay = Math.random() * 5 + 's';
        heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
        document.getElementById('hearts').appendChild(heart);
    }

    // Safe Key Generator for Room ID
    function makeSafeKey(text) {
        let clean = text.toLowerCase().replace(/[^a-z0-9]/g, "");
        if (!clean) {
            clean = "id_" + Math.floor(Math.random() * 100000);
        }
        return clean;
    }

    function joinRoom() {
        const name = document.getElementById("username-input").value.trim();
        const room = document.getElementById("room-input").value.trim();

        if (!name || !room) {
            alert("Pehle apna Naam aur Secret Code toh dalein! 😉");
            return;
        }

        currentUser = name;
        currentRoom = makeSafeKey(room);

        document.getElementById("join-screen").style.display = "none";
        document.getElementById("chat-screen").style.display = "flex";
        document.getElementById("room-header").innerText = "💖 " + room;

        listenForMessages();
    }

    function sendMessage() {
        const input = document.getElementById("message-input");
        const messageText = input.value.trim();
        if (!messageText) return;

        const msgRef = db.ref("chat_rooms/" + currentRoom + "/messages").push();
        msgRef.set({
            sender: currentUser,
            text: messageText,
            timestamp: Date.now(),
            seen: false
        });
        input.value = "";
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

    function listenForMessages() {
        const container = document.getElementById("messages-container");
        const messagesRef = db.ref("chat_rooms/" + currentRoom + "/messages");

        // Real-time message listener
        messagesRef.on("child_added", (snapshot) => {
            const data = snapshot.val();
            const msgId = snapshot.key;

            let msgDiv = document.getElementById("msg-" + msgId);
            if (!msgDiv) {
                msgDiv = document.createElement("div");
                msgDiv.id = "msg-" + msgId;
                const isSelf = data.sender === currentUser;
                msgDiv.className = `message ${isSelf ? 'sent' : 'received'}`;
                
                msgDiv.innerHTML = `
                    ${!isSelf ? `<div class="sender-name">${data.sender}</div>` : ''}
                    <div>${data.text}</div>
                    <div class="msg-footer">
                        <span id="timer-${msgId}">${data.seen ? '🔥 1m' : '✔'}</span>
                    </div>
                `;
                container.appendChild(msgDiv);
                container.scrollTop = container.scrollHeight;
            }

            // Mark as seen for received messages
            if (data.sender !== currentUser && !data.seen) {
                messagesRef.child(msgId).update({ seen: true, seenAt: Date.now() });
            }

            // Start auto-delete countdown
            if (data.seen && data.seenAt) {
                startAutoDeleteTimer(msgId, data.seenAt);
            }
        });

        // Update when seen status changes
        messagesRef.on("child_changed", (snapshot) => {
            const data = snapshot.val();
            const msgId = snapshot.key;
            if (data.seen && data.seenAt) {
                startAutoDeleteTimer(msgId, data.seenAt);
            }
        });

        // Remove deleted messages from UI
        messagesRef.on("child_removed", (snapshot) => {
            const msgDiv = document.getElementById("msg-" + snapshot.key);
            if (msgDiv) msgDiv.remove();
        });
    }

    // 1-Minute Auto Delete Logic
    function startAutoDeleteTimer(msgId, seenAt) {
        const timerSpan = document.getElementById("timer-" + msgId);

        const updateTimer = () => {
            const elapsed = Math.floor((Date.now() - seenAt) / 1000);
            const remaining = 60 - elapsed;

            if (remaining <= 0) {
                db.ref("chat_rooms/" + currentRoom + "/messages/" + msgId).remove();
            } else {
                if (timerSpan) timerSpan.innerText = `🔥 ${remaining}s`;
            }
        };

        updateTimer();
        const interval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - seenAt) / 1000);
            if (60 - elapsed <= 0) {
                clearInterval(interval);
                db.ref("chat_rooms/" + currentRoom + "/messages/" + msgId).remove();
            } else {
                if (timerSpan) timerSpan.innerText = `🔥 ${60 - elapsed}s`;
            }
        }, 1000);
    }
</script>

</body>
</html>
